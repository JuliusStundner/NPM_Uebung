<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPM Übung</title>

  <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>
  <main class="container mt-5">
    <h1 class="mb-4">Meine NPM Übung</h1>

    <div class="row">
      <section class="col-md-6 mb-4">
        <h2>Bootstrap und Sass</h2>
        <p>Meine eigene Hauptfarbe wird mit Sass festgelegt.</p>

        <button type="button" class="btn btn-primary">
          <i class="bi bi-rocket-takeoff" aria-hidden="true"></i>
          Los geht's
        </button>
      </section>

      <section class="col-md-6 mb-4">
        <h2>Automatischer Workflow</h2>
        <p>BrowserSync aktualisiert die Seite bei Änderungen.</p>

        <button type="button" class="btn btn-outline-secondary">
          <i class="bi bi-check-circle" aria-hidden="true"></i>
          Fertig
        </button>
      </section>
    </div>
  </main>
</body>
</html>
